<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass v2 — Interactive Lo-fi</title>
<style>
  :root{
    --paper:#F7F6F2; --panel:#FFFFFF; --line:#B3AFA6; --line-soft:#DAD7CF;
    --ink:#262420; --muted:#7A7568; --pen:#3B5BA5; --pen-soft:#E7ECF7;
    --highlight:#FFDE59; --warn:#C1502E; --warn-soft:#F7E3DD;
    --ok:#3E7C55; --ok-soft:#E4F0E8;
    --mono:'Courier New',Courier,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:13px;}
  a{color:var(--pen);}

  /* ---------- app shell ---------- */
  .app{display:grid; grid-template-columns:214px 1fr; height:100vh;}
  @media (max-width:840px){ .app{grid-template-columns:1fr;} .sidebar{display:none;} }

  .sidebar{background:var(--panel); border-right:2px dashed var(--line); padding:16px 12px; overflow-y:auto;}
  .brand{display:flex; align-items:center; gap:9px; padding:2px 6px 14px;}
  .brand .g{width:26px; height:26px; border:1.5px solid var(--ink); border-radius:50%; display:grid; place-items:center; font-size:14px;}
  .brand b{font-size:16px;} .brand small{display:block; font-family:var(--mono); font-size:9px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase;}
  .navsec{font-family:var(--mono); font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); padding:14px 8px 6px;}
  .navlink{display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:6px; cursor:pointer; color:var(--muted); border:1px solid transparent; margin-bottom:3px;}
  .navlink:hover{background:var(--pen-soft); color:var(--pen);}
  .navlink.on{background:var(--pen); color:#fff; border-color:var(--pen);}
  .navlink .n{font-family:var(--mono); font-size:10px; width:18px; height:18px; border:1px solid currentColor; border-radius:50%; display:grid; place-items:center; flex:none;}
  .navlink .lbl{font-size:12.5px;}
  .navflow{position:relative;}

  .main{overflow-y:auto; height:100vh; scroll-behavior:smooth;}
  .topbar{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1.5px dashed var(--line); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .crumbs{font-family:var(--mono); font-size:11px; color:var(--muted);}
  .crumbs b{color:var(--ink);}
  .stat-strip{font-family:var(--mono); font-size:11px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap;}
  .stat-strip b{color:var(--ink);}
  .page-wrap{padding:22px 24px 70px; max-width:1360px;}
  #page{animation:none;}
  #page.anim{animation:pageIn .24s cubic-bezier(.2,.7,.2,1);}
  @keyframes pageIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){ #page.anim{animation:none;} .main{scroll-behavior:auto;} }

  h1.page-h{font-size:21px; margin:0 0 4px;}
  .page-sub{color:var(--muted); font-size:13px; margin:0 0 18px; max-width:74ch;}

  .panel{background:var(--panel); border:1.5px dashed var(--line); border-radius:6px; padding:14px;}
  .panel-label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 10px; display:flex; align-items:center; gap:6px; justify-content:space-between;}
  .panel-label .t::before{content:'['; color:var(--line);} .panel-label .t::after{content:']'; color:var(--line);}

  .grid3{display:grid; grid-template-columns:236px 1fr 320px; gap:14px; align-items:start;}
  @media (max-width:1150px){ .grid3{grid-template-columns:1fr;} }

  /* buttons */
  .btn{font-family:var(--mono); font-size:11.5px; cursor:pointer; border-radius:5px; text-align:center; padding:8px 12px; border:1.5px dashed var(--pen); color:var(--pen); background:#fff;}
  .btn:hover{background:var(--pen-soft);}
  .btn.solid{background:var(--pen); color:#fff; border-style:solid;} .btn.solid:hover{opacity:.9;}
  .btn.danger{border-color:var(--warn); color:var(--warn);} .btn.danger:hover{background:var(--warn-soft);}
  .btn.ok{border-color:var(--ok); color:var(--ok);} .btn.ok:hover{background:var(--ok-soft);}
  .btn.small{padding:4px 9px; font-size:10.5px;} .btn.full{width:100%;}
  .btnrow{display:flex; gap:8px; flex-wrap:wrap;}
  .next-cta{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  /* group rail */
  .group-item{border:1px solid var(--line-soft); border-radius:5px; padding:9px 10px; margin-bottom:8px; cursor:pointer; background:#fff; position:relative;}
  .group-item:hover{border-color:var(--pen);}
  .group-item.active{border:1.5px solid var(--pen); background:var(--pen-soft);}
  .group-item .gname{font-weight:600; font-size:13px; margin-bottom:3px; padding-right:34px;}
  .group-item .gmeta{font-family:var(--mono); font-size:10px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap;}
  .group-item .gcount{position:absolute; top:8px; right:8px; font-family:var(--mono); font-size:10px; background:var(--highlight); border:1px solid var(--ink); border-radius:10px; padding:1px 7px;}
  .kindchip{font-family:var(--mono); font-size:9px; border:1px solid var(--line); border-radius:3px; padding:0 5px; color:var(--muted);}
  .envchip{font-family:var(--mono); font-size:9px; border-radius:10px; padding:0 6px;}
  .env-prod{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);}
  .env-nonprod,.env-dev,.env-staging{background:var(--pen-soft); color:var(--pen); border:1px solid var(--line-soft);}
  .env-custom{background:#F0ECD8; color:#8a7a2a; border:1px solid #d9c98a;}

  /* condition builder */
  .cond{border:1.5px dashed var(--line-soft); border-radius:6px; padding:10px; margin-bottom:8px; background:#FDFCFA;}
  .cond-grid{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; align-items:end;}
  .cond-grid.tag{grid-template-columns:1fr .9fr .8fr .9fr auto;}
  label.f{display:block; font-family:var(--mono); font-size:10px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px;}
  input[type=text],select{width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:4px; background:#fff; font-family:var(--sans); font-size:12.5px; color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--pen); outline-offset:1px; border-color:var(--pen);}
  .remove-x{border:1px solid var(--warn); color:var(--warn); background:#fff; border-radius:4px; height:32px; width:32px; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center;}
  .remove-x:hover{background:var(--warn-soft);}
  .conn{display:flex; align-items:center; gap:8px; margin:2px 0 8px 12px;}
  .conn .line{flex:0 0 18px; border-top:2px dashed var(--line);}
  .toggle{display:inline-flex; border:1px solid var(--pen); border-radius:14px; overflow:hidden; font-family:var(--mono); font-size:10.5px;}
  .toggle span{padding:3px 12px; cursor:pointer; color:var(--pen); background:#fff;}
  .toggle span.on{background:var(--pen); color:#fff;}
  .add-cond{border:1.5px dashed var(--line); border-radius:6px; padding:9px; text-align:center; font-family:var(--mono); font-size:11.5px; color:var(--muted); cursor:pointer; margin-bottom:14px;}
  .add-cond:hover{border-color:var(--pen); color:var(--pen);}
  .name-edit{display:flex; gap:8px; margin-bottom:12px;}
  .name-edit input{font-size:15px; font-weight:600;}
  hr.sk{border:none; border-top:1.5px dashed var(--line); margin:14px 0;}

  /* preview + cards */
  .match-count{font-family:var(--mono); font-size:24px; font-weight:bold; display:flex; align-items:baseline; gap:8px;}
  .match-count .of{font-size:12px; color:var(--muted); font-weight:normal;}
  .plist{max-height:320px; overflow-y:auto; margin-top:10px;}
  .rcard{border:1px solid var(--line-soft); border-radius:5px; padding:7px 9px; margin-bottom:6px; background:#fff;}
  .rcard .rn{font-size:12px; font-weight:600;} .rcard .rm{font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:2px;}
  .rtags{margin-top:4px; display:flex; flex-wrap:wrap; gap:4px;}
  .rtag{font-family:var(--mono); font-size:9.5px; background:var(--pen-soft); border:1px solid var(--line-soft); border-radius:3px; padding:1px 5px;}
  .empty{font-family:var(--mono); font-size:11px; color:var(--muted); border:1px dashed var(--line-soft); border-radius:5px; padding:16px; text-align:center;}

  /* conflict */
  .conflict-row{border:1px solid var(--warn); background:var(--warn-soft); border-radius:5px; padding:10px 12px; margin-bottom:10px;}
  .conflict-row .cn{font-weight:600; font-size:13px;}
  .conflict-row .cg{font-family:var(--mono); font-size:10.5px; color:var(--warn); margin:3px 0 8px;}
  .resolved-tick{color:var(--ok); font-family:var(--mono); font-size:11px;}

  /* AI drawer */
  .drawer-bg{position:fixed; inset:0; background:rgba(38,36,32,.35); z-index:80; opacity:0; pointer-events:none; transition:opacity .2s;}
  .drawer-bg.open{opacity:1; pointer-events:auto;}
  .drawer{position:fixed; top:0; right:0; height:100%; width:400px; max-width:92vw; background:var(--panel); border-left:2px solid var(--ink); z-index:81; transform:translateX(100%); transition:transform .26s cubic-bezier(.2,.7,.2,1); display:flex; flex-direction:column; padding:16px;}
  .drawer.open{transform:none;}
  .chat{flex:1; border:1px solid var(--line-soft); border-radius:6px; background:#FDFCFA; padding:10px; overflow-y:auto; margin-bottom:8px;}
  .bubble{border-radius:8px; padding:8px 11px; margin:6px 0; font-size:12.5px; max-width:92%; line-height:1.5;}
  .bubble.u{background:var(--highlight); border:1px solid var(--ink); margin-left:auto;}
  .bubble.a{background:#fff; border:1px solid var(--line-soft);}
  .chatbar{display:flex; gap:8px;}
  .hl{background:var(--highlight); padding:0 3px; border-radius:2px;}
  .fab{position:fixed; bottom:22px; right:22px; z-index:60; background:var(--pen); color:#fff; border:none; border-radius:24px; padding:12px 18px; font-family:var(--mono); font-size:12px; cursor:pointer; box-shadow:3px 3px 0 rgba(0,0,0,.15);}
  .fab:hover{opacity:.92;}

  /* stat tiles */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px;}
  .tile{background:var(--panel); border:1.5px dashed var(--line); border-radius:6px; padding:12px 14px;}
  .tile .k{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);}
  .tile .v{font-size:22px; font-weight:700; margin-top:3px;} .tile .d{font-size:11px; color:var(--muted); margin-top:2px;}

  /* treemap */
  .treemap{display:flex; flex-wrap:wrap; gap:5px;}
  .tm{border:1.5px solid var(--line); border-radius:5px; padding:9px 10px; cursor:pointer; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; min-height:66px; min-width:120px; transition:outline .12s;}
  .tm:hover{outline:2px solid var(--pen);}
  .tm .tmn{font-weight:600; font-size:12.5px;} .tm .tmsub{font-family:var(--mono); font-size:9.5px; color:var(--muted);}
  .tm .tmc{font-family:var(--mono); font-size:15px; font-weight:bold; margin-top:6px;}
  .tm.orph{border-style:dashed; border-color:var(--muted); background:repeating-linear-gradient(45deg,#fff,#fff 6px,#f0eee7 6px,#f0eee7 12px);}
  .tm.unassigned{border-style:dashed; border-color:var(--warn); background:var(--warn-soft);}

  /* group cards */
  .cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px;}
  .gcard{border:1.5px dashed var(--line); border-radius:8px; background:var(--panel); padding:14px; cursor:pointer; transition:transform .12s, box-shadow .12s;}
  .gcard:hover{border-color:var(--pen); box-shadow:4px 4px 0 var(--pen-soft); transform:translateY(-2px);}
  .gcard.special{border-color:var(--warn);} .gcard.orph{border-color:var(--muted);}
  .gcard .ch{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px;}
  .gcard .ct{font-size:15px; font-weight:700;}
  .gcard .cmeta{display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap;}
  .costgraph{display:flex; align-items:flex-end; gap:3px; height:44px; margin:8px 0;}
  .costgraph i{flex:1; background:var(--pen-soft); border-top:2px solid var(--pen); border-radius:2px 2px 0 0;}
  .gcard .cstats{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--muted); border-top:1px dashed var(--line-soft); padding-top:8px;}
  .gcard .cstats b{color:var(--ink); font-size:14px;}

  /* tables */
  table{width:100%; border-collapse:collapse; font-size:12px;}
  th{font-family:var(--mono); font-size:10px; text-transform:uppercase; color:var(--muted); text-align:left; padding:7px 8px; border-bottom:2px dashed var(--line); position:sticky; top:0; background:var(--panel);}
  td{padding:6px 8px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  tbody tr:hover td{background:#FFFDF2;}
  tr.rowclick{cursor:pointer;}
  .type-chip{font-family:var(--mono); font-size:10px; border:1px solid var(--line); border-radius:3px; padding:1px 6px; display:inline-block; white-space:nowrap;}
  .status-chip{font-family:var(--mono); font-size:10px; padding:1px 7px; border-radius:10px; display:inline-block; white-space:nowrap;}
  .st-assigned{background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok);}
  .st-shared{background:var(--pen-soft); color:var(--pen); border:1px solid var(--pen);}
  .st-conflict{background:var(--warn); color:#fff;}
  .st-unassigned{background:var(--warn-soft); color:var(--warn); border:1px dashed var(--warn);}
  .st-orphaned{background:#eee; color:var(--muted); border:1px dashed var(--muted);}
  .num{text-align:right; font-family:var(--mono); white-space:nowrap;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px; flex-wrap:wrap;}
  .filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .filters input,.filters select{width:auto; min-width:130px;}
  .legend{font-family:var(--mono); font-size:10px; color:var(--muted); display:flex; gap:14px; margin-top:10px; flex-wrap:wrap;}

  /* modal */
  .modal-bg{position:fixed; inset:0; background:rgba(38,36,32,.4); display:flex; align-items:flex-start; justify-content:center; padding:60px 16px; z-index:100; overflow:auto; animation:pageIn .18s ease;}
  .modal{background:var(--panel); border:2px solid var(--ink); border-radius:8px; padding:18px; width:560px; max-width:100%; box-shadow:6px 6px 0 rgba(0,0,0,.15);}
  .modal h3{margin:0 0 12px; font-size:16px;}
  .link-item{display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px dashed var(--line-soft); font-size:12.5px;}
  .link-item:last-child{border-bottom:none;} .link-item .lr{font-family:var(--mono); font-size:10px; color:var(--muted); margin-left:auto;}

  /* detail */
  .detailgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start;}
  @media (max-width:900px){ .detailgrid{grid-template-columns:1fr;} }
  .kv{display:grid; grid-template-columns:130px 1fr; gap:5px 10px; font-size:12.5px;}
  .kv .k{color:var(--muted); font-family:var(--mono); font-size:11px;}
  .back{font-family:var(--mono); font-size:11px; color:var(--pen); cursor:pointer; display:inline-block; margin-bottom:8px;}
  .rec{border:1px dashed var(--pen); background:var(--pen-soft); border-radius:5px; padding:9px 11px; margin-bottom:8px; font-size:12px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .tree-row{padding:5px 0; font-size:12.5px; display:flex; align-items:center; gap:8px;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--pen); flex:none;} .dot.child{background:var(--muted);}
  .barmini{height:8px; background:var(--pen-soft); border-radius:4px; overflow:hidden; border:1px solid var(--line-soft);}
  .barmini i{display:block; height:100%; background:var(--pen);}

  /* connect + mapping */
  .connect-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:820px){ .connect-grid{grid-template-columns:1fr;} }
  .src-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line-soft); font-size:12.5px;}
  .src-row:last-child{border-bottom:none;}
  .spin{width:40px; height:40px; border:4px solid var(--line-soft); border-top-color:var(--pen); border-radius:50%; margin:0 auto 10px; animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none;} }
  .bigbar{height:20px; border:1.5px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; margin:14px 0 6px;}
  .bigbar i{display:block; height:100%; width:0; background:var(--pen); transition:width .2s linear;}
  .mapline{display:flex; align-items:center; gap:10px; margin:6px 0; font-size:12px;}
  .mapline .nm{width:150px; text-align:right; color:var(--muted); font-family:var(--mono); font-size:11px;}
  .mapline .track{flex:1; height:8px; background:#fff; border:1px solid var(--line-soft); border-radius:5px; overflow:hidden;}
  .mapline .track i{display:block; height:100%; width:0; background:var(--pen-soft); border-right:2px solid var(--pen); transition:width .22s linear;}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR (persistent) -->
  <aside class="sidebar">
    <div class="brand"><div class="g">◎</div><div><b>Compass</b><small>v2 · interactive</small></div></div>
    <div class="navsec">Set up</div>
    <div class="navflow" id="nav-setup">
      <div class="navlink" data-nav="connect"><span class="n">1</span><span class="lbl">Connect</span></div>
      <div class="navlink" data-nav="groups"><span class="n">2</span><span class="lbl">Define groups</span></div>
      <div class="navlink" data-nav="conflicts"><span class="n">3</span><span class="lbl">Conflicts</span></div>
      <div class="navlink" data-nav="mapping"><span class="n">4</span><span class="lbl">Map resources</span></div>
    </div>
    <div class="navsec">Explore</div>
    <div class="navflow">
      <div class="navlink" data-nav="overview"><span class="n">5</span><span class="lbl">Groups overview</span></div>
      <div class="navlink" data-nav="resources"><span class="n">6</span><span class="lbl">All resources</span></div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main" id="main">
    <div class="topbar">
      <div class="crumbs" id="crumbs">Compass</div>
      <div class="stat-strip" id="stats"></div>
    </div>
    <div class="page-wrap"><div id="page"></div></div>
  </div>
</div>

<!-- AI drawer + FAB (persistent) -->
<button class="fab" id="ai-fab" data-action="toggleAI">✦ AI assist</button>
<div class="drawer-bg" id="drawer-bg" data-action="toggleAI"></div>
<div class="drawer" id="drawer">
  <div class="panel-label" style="justify-content:space-between;"><span class="t">Native AI — describe a rule</span><span class="btn small" data-action="toggleAI" style="border:none;">✕ close</span></div>
  <div class="chat" id="ai-chat"></div>
  <div class="chatbar">
    <input type="text" id="ai-input" placeholder="e.g. group name starts with data- as a new Team called Data Eng">
    <div class="btn solid" data-action="aiSend" style="padding:8px 16px;">Send</div>
  </div>
</div>

<div id="modal-root"></div>

<script>
/* ============================================================
   Compass v2 — interactive lo-fi with a persistent shell,
   hash-routed separate pages, and smooth enter transitions.
   Rule engine extended from the provided resource-rule-builder.
   ============================================================ */

/* ---------- seeded RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(42); const rint=(a,b)=>Math.floor(rng()*(b-a+1))+a;

/* ---------- reference data ---------- */
const TEAMS=['Payments','Checkout','Marketing','Core-Platform','Data-Eng'];
const ENVS=['prod','dev','staging'];
const OWNERS=['jsmith','arao','mchen','tolawale','pgarcia'];
const ACCOUNTS=[{id:'111122223333',alias:'payments-prod'},{id:'222233334444',alias:'marketing-prod'},{id:'333344445555',alias:'shared-dev'},{id:'444455556666',alias:'data-eng-prod'}];
const VPCS=['vpc-0aa111','vpc-0bb222','vpc-0cc333','vpc-0dd444'];
const COST={EC2:[220,1400],RDS:[600,3200],Redshift:[1800,5200],ElastiCache:[180,900],Lambda:[15,240],S3:[25,520],DynamoDB:[40,600],SNS:[4,45],Cognito:[15,120],StepFunctions:[18,160],EBS:[20,180],ENI:[2,15],SecurityGroup:[0,0]};
const TEMPLATES=[['pay-checkout-svc','EC2'],['pay-checkout-svc','SecurityGroup'],['pay-api-gw','Lambda'],['pay-ledger-db','RDS'],['pay-events','SNS'],['pay-audit-logs','S3'],['chk-cart-lambda','Lambda'],['chk-cart-cache','ElastiCache'],['chk-session-store','DynamoDB'],['chk-web-frontend','EC2'],['chk-assets','S3'],['mkt-campaign-assets','S3'],['mkt-analytics-db','RDS'],['mkt-email-worker','Lambda'],['mkt-cdn-origin','S3'],['mkt-crm-sync','Lambda'],['core-auth-svc','EC2'],['core-auth-sg','SecurityGroup'],['core-idp','Cognito'],['core-shared-vpc-nat','EC2'],['core-config-store','S3'],['core-audit-trail','S3'],['data-lake-raw','S3'],['data-lake-curated','S3'],['data-etl-job','Lambda'],['data-warehouse','Redshift'],['data-pipeline-orchestrator','StepFunctions']];
const costFor=t=>{const c=COST[t]||[20,200]; return rint(c[0],c[1]);};

function buildResources(){
  const res=[]; let n=1;
  TEMPLATES.forEach((t,i)=>{ ENVS.forEach((env,ei)=>{
    if(ei===2 && i%3!==0) return;
    const team=TEAMS[Math.floor(i/(TEMPLATES.length/TEAMS.length))]||TEAMS[i%TEAMS.length];
    const account=ACCOUNTS[TEAMS.indexOf(team)%ACCOUNTS.length]||ACCOUNTS[0];
    const owner=OWNERS[(i+ei)%OWNERS.length]; const vpc=VPCS[i%VPCS.length]; const app=t[0];
    res.push({id:'rsc-'+n, name:`${app}-${env}-${String(n).padStart(2,'0')}`, app, type:t[1], account:account.alias, accountId:account.id, vpc, owner, team, env, createdBy:owner+'@corp.com', cost:costFor(t[1]), cluster:app+'|'+env, parent:null, links:[], orphaned:false, tags:{Env:env,Team:team,Owner:owner,CostCenter:'CC-'+(1000+TEAMS.indexOf(team)*10)}});
    n++;
  });});
  const ORPH=[['i-0a91f','EC2'],['vol-0f2e','EBS'],['eni-04b7','ENI'],['i-07c3d','EC2'],['vol-1a83','EBS'],['s3-legacy-bkt-7742','S3'],['eni-0d19','ENI'],['i-0b52a','EC2'],['vol-9c04','EBS'],['i-0e77f','EC2'],['s3-tmp-4410','S3'],['eni-0aa2','ENI']];
  ORPH.forEach(o=>{ res.push({id:'rsc-'+n, name:o[0], app:'(none)', type:o[1], account:ACCOUNTS[rint(0,3)].alias, accountId:'—', vpc:rng()<.5?VPCS[rint(0,3)]:'—', owner:'—', team:'—', env:'unknown', createdBy:'—', cost:costFor(o[1]), cluster:'orphan-'+n, parent:null, links:[], orphaned:true, tags:{}}); n++; });
  const byC={}; res.forEach(r=>{(byC[r.cluster]=byC[r.cluster]||[]).push(r);});
  Object.values(byC).forEach(list=>{ if(list.length<2) return; const prio={EC2:4,RDS:3,Redshift:3,Lambda:2}; const parent=list.slice().sort((a,b)=>(prio[b.type]||1)-(prio[a.type]||1))[0]; list.forEach(r=>{ r.links=list.filter(x=>x.id!==r.id).map(x=>x.id); if(r!==parent) r.parent=parent.id; }); });
  return res;
}

  {id:'g6',name:'Audit & Compliance',kind:'Feature',env:'prod',conditions:[{field:'name',op:'contains',value:'audit'}],connectors:[]},
];

let overrides={}, sharedResolutions={};

const FIELD_OPTIONS=[{value:'name',label:'Resource name'},{value:'type',label:'Resource type'},{value:'account',label:'Account'},{value:'vpc',label:'VPC'},{value:'owner',label:'Owner / Created by'},{value:'team',label:'Team / Group'},{value:'tagValue',label:'Tag (key = value)'},{value:'tagExists',label:'Tag key exists'}];
const OPS_TEXT=[{value:'equals',label:'equals'},{value:'notEquals',label:'not equals'},{value:'contains',label:'contains'},{value:'startsWith',label:'starts with'},{value:'endsWith',label:'ends with'}];
const OPS_TAG=[{value:'equals',label:'equals'},{value:'contains',label:'contains'}];
const TYPE_VALUES=['EC2','S3','RDS','Lambda','SecurityGroup','DynamoDB','ElastiCache','SNS','Cognito','Redshift','StepFunctions','EBS','ENI'];
const KINDS=['Product','Feature','Customer','Team']; const ENV_OPTS=['prod','non-prod','dev','staging','custom'];

/* ---------- engine ---------- */
function evalCondition(r,cond){
  let left;
  if(cond.field==='tagValue') left=(r.tags[cond.tagKey||'Env']||'');
  else if(cond.field==='tagExists') return !!r.tags[cond.value];
  else left=String(r[cond.field]??'');
  const val=cond.value||'';
  switch(cond.op){
    case 'equals':return left.toLowerCase()===val.toLowerCase();
    case 'notEquals':return left.toLowerCase()!==val.toLowerCase();
    case 'contains':return left.toLowerCase().includes(val.toLowerCase());
    case 'startsWith':return left.toLowerCase().startsWith(val.toLowerCase());
    case 'endsWith':return left.toLowerCase().endsWith(val.toLowerCase());
    default:return false;
  }
}
function evalGroup(r,g){ if(!g.conditions.length) return false; let res=evalCondition(r,g.conditions[0]); for(let i=1;i<g.conditions.length;i++){ const c=g.connectors[i-1]||'AND'; const nx=evalCondition(r,g.conditions[i]); res=c==='AND'?(res&&nx):(res||nx);} return res; }
const groupById=id=>groups.find(g=>g.id===id);
const ruleMatches=r=>groups.filter(g=>evalGroup(r,g)).map(g=>g.id);
function assignmentFor(r){
  if(overrides[r.id]){ const g=groupById(overrides[r.id]); return {status:'assigned',groups:g?[g.id]:[],overridden:true}; }
  if(r.orphaned) return {status:'orphaned',groups:[]};
  const m=ruleMatches(r);
  if(m.length===0) return {status:'unassigned',groups:[]};
  if(m.length===1) return {status:'assigned',groups:m};
  const res=sharedResolutions[r.id];
  if(res==='shared') return {status:'shared',groups:m};
  if(res && groupById(res)) return {status:'assigned',groups:[res],resolved:true};
  return {status:'conflict',groups:m};
}
const resourcesInGroup=gid=>RESOURCES.filter(r=>{const a=assignmentFor(r); return (a.status==='assigned'||a.status==='shared')&&a.groups.includes(gid);});
const bucket=st=>RESOURCES.filter(r=>assignmentFor(r).status===st);
const groupCost=gid=>resourcesInGroup(gid).reduce((s,r)=>{const a=assignmentFor(r); return s+(a.status==='shared'?r.cost/a.groups.length:r.cost);},0);
const conflictResources=()=>RESOURCES.filter(r=>assignmentFor(r).status==='conflict');

/* ---------- format ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString();
const moneyK=n=>n>=1000?'$'+(n/1000).toFixed(1)+'k':'$'+Math.round(n);
const envClass=e=>'env-'+(['prod','non-prod','dev','staging'].includes(e)?(e==='non-prod'?'nonprod':e):'custom');
function sparkBars(seed,c){const r=mulberry32(seed);let h='';for(let i=0;i<c;i++)h+='<i style="height:'+(20+Math.floor(r()*80))+'%"></i>';return h;}

function builderHtml(g){

  g.conditions.forEach((cond,idx)=>{

  </div>`;
}
function condRow(cond,idx){
  const isTV=cond.field==='tagValue', isTE=cond.field==='tagExists';
  const fieldSel=`<div><label class="f">Field</label><select data-cond="${idx}" data-part="field">${FIELD_OPTIONS.map(f=>`<option value="${f.value}" ${f.value===cond.field?'selected':''}>${f.label}</option>`).join('')}</select></div>`;
  let mid='';
  if(isTV){
    mid=`<div><label class="f">Tag key</label><input type="text" id="cond-key-${idx}" data-cond="${idx}" data-part="tagKey" value="${esc(cond.tagKey||'Env')}"></div>
      <div><label class="f">Op</label><select data-cond="${idx}" data-part="op">${OPS_TAG.map(o=>`<option value="${o.value}" ${o.value===cond.op?'selected':''}>${o.label}</option>`).join('')}</select></div>
      <div><label class="f">Value</label><input type="text" id="cond-val-${idx}" data-cond="${idx}" data-part="value" value="${esc(cond.value||'')}"></div>`;
  } else if(isTE){
    mid=`<div style="grid-column:span 2;"><label class="f">Tag key must exist</label><input type="text" id="cond-val-${idx}" data-cond="${idx}" data-part="value" value="${esc(cond.value||'')}" placeholder="CostCenter"></div>`;
  } else {
    const opSel=`<div><label class="f">Op</label><select data-cond="${idx}" data-part="op">${OPS_TEXT.map(o=>`<option value="${o.value}" ${o.value===cond.op?'selected':''}>${o.label}</option>`).join('')}</select></div>`;
    const selList=(arr,val)=>`<div><label class="f">Value</label><select data-cond="${idx}" data-part="value">${arr.map(v=>`<option value="${v}" ${v===val?'selected':''}>${v}</option>`).join('')}</select></div>`;
    let valField;
    if(cond.field==='type') valField=selList(TYPE_VALUES,cond.value||TYPE_VALUES[0]);
    else if(cond.field==='account') valField=selList(ACCOUNTS.map(a=>a.alias),cond.value||ACCOUNTS[0].alias);
    else if(cond.field==='vpc') valField=selList(VPCS,cond.value||VPCS[0]);
    else if(cond.field==='team') valField=selList(TEAMS,cond.value||TEAMS[0]);
    else valField=`<div><label class="f">Value</label><input type="text" id="cond-val-${idx}" data-cond="${idx}" data-part="value" value="${esc(cond.value||'')}" placeholder="value..."></div>`;
    mid=opSel+valField;
  }
  return `<div class="cond"><div class="cond-grid ${isTV?'tag':''}">${fieldSel}${mid}<div><label class="f">&nbsp;</label><div class="remove-x" data-action="removeCondition" data-idx="${idx}">×</div></div></div></div>`;
}

function runMapping(){
  const fill=document.getElementById('map-fill'), pct=document.getElementById('map-pct'), cnt=document.getElementById('map-count'), done=document.getElementById('map-done'), spin=document.getElementById('map-spin'), status=document.getElementById('map-status');
  if(!fill) return;
  mapPct=0; if(mapTimer) clearInterval(mapTimer);
  const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const paint=v=>{ fill.style.width=v+'%'; if(pct)pct.textContent=Math.round(v)+'%'; if(cnt)cnt.textContent=Math.round(v/100*RESOURCES.length)+' / '+RESOURCES.length; document.querySelectorAll('[data-mapline]').forEach(b=>b.style.width=v+'%'); };
  const finish=()=>{ paint(100); mapped=true; if(spin)spin.style.visibility='hidden'; if(status)status.textContent='Done'; if(done)done.style.display='block'; };
  if(reduce){ finish(); return; }
  mapTimer=setInterval(()=>{ mapPct+=Math.random()*9+4; if(mapPct>=100){clearInterval(mapTimer); finish(); return;} paint(mapPct); },160);
}

      <div class="tile"><div class="k">Accounts</div><div class="v">${accounts.length}</div><div class="d">${esc(accounts.slice(0,2).join(', '))}</div></div>

    </div>
    <div class="detailgrid">
      <div>
        <div class="panel" style="margin-bottom:14px;"><p class="panel-label"><span class="t">Metadata</span></p><div class="kv"><span class="k">Kind</span><span>${g.kind}</span><span class="k">Environment</span><span><span class="envchip ${envClass(g.env)}">${g.env}</span></span><span class="k">Accounts</span><span>${esc(accounts.join(', ')||'—')}</span><span class="k">VPCs</span><span>${esc(vpcs.join(', ')||'—')}</span><span class="k">Rule</span><span style="font-family:var(--mono); font-size:11px;">${ruleText(g)}</span></div></div>
        <div class="panel" style="margin-bottom:14px;"><p class="panel-label"><span class="t">Resource types</span></p>${typeRows||'<div class="empty">none</div>'}</div>

const ruleText=g=>!g.conditions.length?'(none)':g.conditions.map((c,i)=>(i?` ${g.connectors[i-1]||'AND'} `:'')+`${c.field}${c.tagKey?':'+c.tagKey:''} ${c.op} "${c.value}"`).join('');

function filteredResources(){
  return RESOURCES.filter(r=>{const a=assignmentFor(r);

    if(filt.group&&!a.groups.includes(filt.group)) return false;
    if(filt.q){const hay=[r.name,r.type,r.account,r.owner,r.team,...Object.values(r.tags)].join(' ').toLowerCase(); if(!hay.includes(filt.q.toLowerCase())) return false;}

function resRow(r,ctx){

  if(ctx==='group') return `<tr class="rowclick"><td data-action="openResource" data-id="${r.id}"><b>${esc(r.name)}</b></td><td><span class="type-chip">${r.type}</span></td><td class="num">${money(r.cost)}</td><td><div class="btn small danger" data-action="moveResource" data-id="${r.id}">Move out ▾</div></td></tr>`;
  return `<tr class="rowclick"><td data-action="openResource" data-id="${r.id}"><b>${esc(r.name)}</b></td><td><span class="type-chip">${r.type}</span></td><td>${esc(r.account)}</td><td class="num">${money(r.cost)}</td><td><div class="btn small ok" data-action="moveResource" data-id="${r.id}">Assign ▾</div></td></tr>`;

function pageResource(){
  const r=byId(resourceId); if(!r) return `<div class="panel"><div class="empty">Resource not found.</div></div>`;
  const a=assignmentFor(r);
  let top=r; const chain=[]; let guard=0; while(top.parent&&guard++<20){chain.unshift(byId(top.parent)); top=byId(top.parent);}
  const children=RESOURCES.filter(x=>x.parent===r.id);
  const links=(r.links||[]).map(byId).filter(Boolean);
  const linkRows=links.length? links.map(x=>{const xa=assignmentFor(x); const other=xa.groups.length&&a.groups.length&&!xa.groups.some(g=>a.groups.includes(g)); return `<div class="link-item"><span class="dot ${x.parent===r.id?'child':''}"></span><b data-action="openResource" data-id="${x.id}" style="cursor:pointer; text-decoration:underline;">${esc(x.name)}</b><span class="type-chip">${x.type}</span><span class="lr">${x.parent===r.id?'child':(r.parent===x.id?'parent':'linked')}${other?' · other group':''}</span></div>`;}).join('') : `<div class="empty">No linked resources.</div>`;
  const tagRows=Object.keys(r.tags).length? Object.entries(r.tags).map(([k,v])=>`<span class="k">${esc(k)}</span><span><span class="rtag">${esc(v)}</span></span>`).join('') : `<span class="k">tags</span><span style="color:var(--warn)">none — orphaned</span>`;
  let tree=''; chain.forEach((p,i)=>{tree+=`<div class="tree-row" style="margin-left:${i*16}px;"><span class="dot"></span><b data-action="openResource" data-id="${p.id}" style="cursor:pointer; text-decoration:underline;">${esc(p.name)}</b> <span class="type-chip">${p.type}</span> <span style="font-family:var(--mono); font-size:10px; color:var(--muted);">parent</span></div>`;});
  tree+=`<div class="tree-row" style="margin-left:${chain.length*16}px;"><span class="dot" style="background:var(--warn)"></span><b>${esc(r.name)}</b> <span class="type-chip">${r.type}</span> <span style="font-family:var(--mono); font-size:10px; color:var(--warn);">this</span></div>`;
  children.forEach(c=>{tree+=`<div class="tree-row" style="margin-left:${(chain.length+1)*16}px;"><span class="dot child"></span><b data-action="openResource" data-id="${c.id}" style="cursor:pointer; text-decoration:underline;">${esc(c.name)}</b> <span class="type-chip">${c.type}</span> <span style="font-family:var(--mono); font-size:10px; color:var(--muted);">child</span></div>`;});
  if(!chain.length&&!children.length) tree+=`<div class="empty" style="margin-top:8px;">Standalone — no parent or children.</div>`;
  return `<span class="back" data-nav="resources">← all resources</span>
    <div class="toolbar"><div><h1 class="page-h" style="margin-bottom:4px;">${esc(r.name)} <span class="status-chip st-${a.status}">${a.status}</span></h1><div style="font-family:var(--mono); font-size:11px; color:var(--muted);">${r.type} · ${r.account} · ${r.vpc} · ${money(r.cost)}/mo</div></div>
      <div class="btnrow"><div class="btn small" data-action="moveResource" data-id="${r.id}">Move ▾</div><div class="btn small ok" data-action="downloadResource" data-id="${r.id}">⤓ Download report</div></div></div>
    <div class="detailgrid">
      <div>
        <div class="panel" style="margin-bottom:14px;"><p class="panel-label"><span class="t">Cost insights</span></p><div class="match-count" style="font-size:22px;"><span>${money(r.cost)}</span><span class="of">/ month</span></div><div class="costgraph" style="height:56px; margin-top:10px;">${sparkBars(r.id.length+9,12)}</div><div class="kv" style="margin-top:10px;"><span class="k">Annualised</span><span>${money(r.cost*12)}</span><span class="k">Group share</span><span>${a.groups.length?Math.round(r.cost/Math.max(groupCost(a.groups[0]),1)*100)+'% of '+esc(groupById(a.groups[0]).name):'—'}</span><span class="k">Forecast</span><span>~${money(r.cost*1.08)} next mo</span></div></div>
        <div class="panel"><p class="panel-label"><span class="t">Tags &amp; metadata</span></p><div class="kv"><span class="k">ARN account</span><span>${esc(r.accountId)}</span><span class="k">VPC</span><span>${esc(r.vpc)}</span><span class="k">Owner</span><span>${esc(r.owner)}</span><span class="k">Created by</span><span>${esc(r.createdBy)}</span>${tagRows}</div></div>
      </div>
      <div>
        <div class="panel" style="margin-bottom:14px;"><p class="panel-label"><span class="t">Hierarchy — parent → this → children</span></p>${tree}</div>
        <div class="panel"><p class="panel-label"><span class="t">Linked &amp; shared</span><span>${links.length}</span></p>${linkRows}</div>
      </div>
    </div>`;
}

function download(fn,content){const b=new Blob([content],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fn; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

function downloadResource(rid){const r=byId(rid),a=assignmentFor(r); const txt=`Compass — Resource 360\n\nname: ${r.name}\ntype: ${r.type}\naccount: ${r.account} (${r.accountId})\nvpc: ${r.vpc}\nowner: ${r.owner}\nmonthly_cost: ${money(r.cost)}\nannualised: ${money(r.cost*12)}\nstatus: ${a.status}\ngroups: ${a.groups.map(g=>groupById(g).name).join(', ')||'—'}\nparent: ${r.parent?byId(r.parent).name:'—'}\nlinked: ${(r.links||[]).map(id=>byId(id).name).join(', ')||'—'}\ntags: ${Object.entries(r.tags).map(([k,v])=>k+'='+v).join(', ')||'none'}\n`; download(`compass-resource-${r.name}.txt`,txt);}

function renderAI(){
  const c=document.getElementById('ai-chat');
  c.innerHTML=aiLog.map(m=>`<div class="bubble ${m.role==='u'?'u':'a'}">${m.html}</div>`).join('')||`<div class="bubble a">Hi! Tell me what to group. Try: <span class="hl">"group everything starting with data- as a new Team called Data Eng"</span> or <span class="hl">"add RDS resources in payments-prod"</span>.</div>`;
  c.scrollTop=c.scrollHeight;
}
function parseIntent(text){
  const t=text.toLowerCase(); const conds=[]; let groupName=null,kind=null,env=null,m;
  const mName=text.match(/\b(?:as|called|named)\s+(?:a\s+)?(?:new\s+)?(?:team|product|feature|customer\s+)?["']?([A-Za-z][\w\- ]{1,30})["']?/i);
  if(mName) groupName=mName[1].trim().replace(/\b\w/g,c=>c.toUpperCase());
  if(/\bteam\b/.test(t))kind='Team'; else if(/\bfeature\b/.test(t))kind='Feature'; else if(/\bcustomer\b/.test(t))kind='Customer'; else if(/\bproduct\b/.test(t))kind='Product';
  if(/non[- ]?prod/.test(t))env='non-prod'; else if(/\bprod\b/.test(t))env='prod'; else if(/\bdev\b/.test(t))env='dev'; else if(/\bstaging\b/.test(t))env='staging';
  if(m=t.match(/(?:start(?:s|ing)? with|prefix(?:ed)?(?: with| by)?)\s+["']?([a-z0-9\-_]+)["']?/)) conds.push({field:'name',op:'startsWith',value:m[1]});
  if(m=t.match(/contain(?:s|ing)?\s+["']?([a-z0-9\-_]+)["']?/)) conds.push({field:'name',op:'contains',value:m[1]});
  if(m=t.match(/end(?:s|ing)? with\s+["']?([a-z0-9\-_]+)["']?/)) conds.push({field:'name',op:'endsWith',value:m[1]});
  TYPE_VALUES.forEach(tp=>{if(new RegExp('\\b'+tp.toLowerCase()+'\\b').test(t)) conds.push({field:'type',op:'equals',value:tp});});
  ACCOUNTS.forEach(a=>{if(t.includes(a.alias)) conds.push({field:'account',op:'equals',value:a.alias});});
  TEAMS.forEach(tm=>{if(t.includes(tm.toLowerCase())) conds.push({field:'team',op:'equals',value:tm});});
  const seen=new Set(); return {conds:conds.filter(c=>{const k=c.field+c.op+c.value; if(seen.has(k))return false; seen.add(k); return true;}),groupName,kind,env};
}
function aiSend(){
  const inp=document.getElementById('ai-input'); const text=inp.value.trim(); if(!text) return;
  aiLog.push({role:'u',html:esc(text)}); inp.value='';
  const {conds,groupName,kind,env}=parseIntent(text);
  if(!conds.length){ aiLog.push({role:'a',html:`I couldn't find a condition. Try <span class="hl">"starts with data-"</span>, <span class="hl">"RDS resources"</span>, or <span class="hl">"in account payments-prod"</span>.`}); }
  else{
    let g;
    if(groupName){ g={id:'g'+Date.now(),name:groupName,kind:kind||'Product',env:env||'non-prod',conditions:[],connectors:[]}; groups.push(g); editGroupId=g.id; }
    else g=groupById(editGroupId)||groups[0];
    conds.forEach(c=>{g.conditions.push(c); if(g.conditions.length>1) g.connectors.push('AND');});
    const n=RESOURCES.filter(r=>evalGroup(r,g)).length;
    const desc=conds.map(c=>`<b>${c.field} ${c.op} ${esc(c.value)}</b>`).join(' AND ');
    aiLog.push({role:'a',html:`${groupName?`Created <b>${esc(g.name)}</b> (${g.kind}·${g.env}). `:''}Added ${desc} to <b>${esc(g.name)}</b> → now <b>${n}</b> resources.`});
  }
  renderAI();
  if(route.page==='groups'||route.page==='conflicts'||route.page==='overview') refresh();
  updateStats();
}

/* =====================================================================
   ROUTER + SHELL
   ===================================================================== */
let route={page:'connect'};
function parseHash(){
  const h=(location.hash||'#connect').replace(/^#/,''); const [p,id]=h.split('/');
  const page=['connect','groups','conflicts','mapping','overview','group','resources','resource'].includes(p)?p:'connect';
  return {page,id};
}
function pageHtml(){
  switch(route.page){
    case 'connect':return pageConnect();
    case 'groups':return pageGroups();
    case 'conflicts':return pageConflicts();
    case 'mapping':return pageMapping();
    case 'overview':return pageOverview();
    case 'group':return pageGroup();
    case 'resources':return pageResources();
    case 'resource':return pageResource();
  }
}
const CRUMB={connect:'Set up · Connect',groups:'Set up · Define groups',conflicts:'Set up · Conflicts',mapping:'Set up · Map resources',overview:'Explore · Groups overview',group:'Explore · Group',resources:'Explore · All resources',resource:'Explore · Resource 360'};
const NAVMAP={connect:'connect',groups:'groups',conflicts:'conflicts',mapping:'mapping',overview:'overview',group:'overview',resources:'resources',resource:'resources'};
function updateStats(){
  const mp=RESOURCES.filter(r=>['assigned','shared'].includes(assignmentFor(r).status)).length;
  document.getElementById('stats').innerHTML=`res <b>${RESOURCES.length}</b> · groups <b>${groups.length}</b> · mapped <b>${mp}</b> · unassigned <b>${bucket('unassigned').length}</b> · orphaned <b>${bucket('orphaned').length}</b>`;
  document.getElementById('crumbs').innerHTML='Compass / <b>'+CRUMB[route.page]+'</b>';
  document.querySelectorAll('.navlink').forEach(n=>n.classList.toggle('on', n.dataset.nav===NAVMAP[route.page]));
}
// full navigation (animated, resets scroll)
function paint(animate){
  const pg=document.getElementById('page');
  pg.classList.remove('anim'); void pg.offsetWidth;
  pg.innerHTML=pageHtml();
  if(animate){ pg.classList.add('anim'); }
  updateStats();
  if(route.page==='mapping') runMapping();
}
function render(){ route=parseHash(); if(route.page==='group'&&route.id) groupId=route.id; if(route.page==='resource'&&route.id) resourceId=route.id; document.getElementById('main').scrollTop=0; paint(true); }
// in-page update (no animation, preserve scroll + focus)
function refresh(){
  const main=document.getElementById('main'); const st=main.scrollTop;
  const act=document.activeElement, aid=act&&act.id, caret=act&&act.selectionStart;
  document.getElementById('page').innerHTML=pageHtml();
  updateStats();
  main.scrollTop=st;
  if(aid){const e=document.getElementById(aid); if(e){e.focus(); if(caret!=null&&e.setSelectionRange){try{e.setSelectionRange(caret,caret);}catch(_){}}}}
}
function go(page,id){ location.hash = id? `#${page}/${id}` : `#${page}`; }
window.addEventListener('hashchange',render);

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const navEl=e.target.closest('[data-nav]');
  if(navEl){ go(navEl.dataset.nav); return; }
  const stop=e.target.closest('[data-stop]');
  const t=e.target.closest('[data-action]'); if(!t) return;
  const A=t.dataset.action, id=t.dataset.id;
  switch(A){
    case 'editGroup': editGroupId=id; refresh(); break;
    case 'newGroup': newGroupModal(); break;
    case 'deleteGroup':{const g=groupById(editGroupId); if(g&&confirm('Delete group "'+g.name+'"? Removes the rule only.')){groups=groups.filter(x=>x.id!==g.id); editGroupId=groups[0]&&groups[0].id; refresh();} break;}
    case 'addCondition':{const g=groupById(editGroupId); if(g){g.conditions.push({field:'name',op:'contains',value:''}); if(g.conditions.length>1) g.connectors.push('AND'); refresh();} break;}
    case 'removeCondition':{const g=groupById(editGroupId),idx=+t.dataset.idx; g.conditions.splice(idx,1); if(idx>0)g.connectors.splice(idx-1,1); else if(g.connectors.length)g.connectors.splice(0,1); refresh(); break;}
    case 'conn':{const g=groupById(editGroupId); g.connectors[+t.dataset.idx]=t.dataset.val; refresh(); break;}
    case 'resolve': sharedResolutions[id]=t.dataset.mode; refresh(); break;
    case 'openGroup': go('group',id); break;
    case 'openResource': go('resource',id); break;
    case 'editRules': editGroupId=id; go('groups'); break;
    case 'moveResource': moveModal(id); break;
    case 'confirmMove': confirmMove(id); break;
    case 'addResourceModal': addResourceModal(id); break;
    case 'confirmAdd': confirmAdd(id); break;
    case 'makeSubgroup':{const parent=groupById(t.dataset.parent),tok=t.dataset.token; const ng={id:'g'+Date.now(),name:parent.name+' · '+tok,kind:parent.kind,env:parent.env,conditions:[{field:'name',op:'contains',value:tok}],connectors:[]}; groups.push(ng); editGroupId=ng.id; go('groups'); break;}
    case 'downloadGroup': downloadGroup(id); break;
    case 'downloadResource': downloadResource(id); break;
    case 'newGroupConfirm': break;
    case 'confirmNewGroup': confirmNewGroup(); break;
    case 'closeModal': closeModal(); break;
    case 'closeModalBg': if(!stop) closeModal(); break;
    case 'toggleAI': toggleAI(); break;
    case 'aiSend': aiSend(); break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target,A=el.dataset.action;
  if(A==='renameGroup'){const g=groupById(editGroupId); if(g){g.name=el.value; const rail=document.getElementById('rail'); if(rail) rail.outerHTML=railHtml(); updateStats();} return;}
  if(A==='filtQ'){filt.q=el.value; updateResBody(); return;}
  if(el.dataset.cond!==undefined){updateCond(el,false); return;}
});
document.addEventListener('change',e=>{
  const el=e.target,A=el.dataset.action;
  if(A==='setKind'){groupById(editGroupId).kind=el.value; refresh(); return;}
  if(A==='setEnv'){groupById(editGroupId).env=el.value; refresh(); return;}
  if(A==='filtType'){filt.type=el.value; refresh(); return;}
  if(A==='filtStatus'){filt.status=el.value; refresh(); return;}
  if(A==='filtGroup'){filt.group=el.value; refresh(); return;}
  if(el.dataset.cond!==undefined){updateCond(el,true); return;}
});
document.getElementById('ai-input').addEventListener('keydown',e=>{ if(e.key==='Enter') aiSend(); });
function updateCond(el,isSel){
  const g=groupById(editGroupId); if(!g) return;
  const idx=+el.dataset.cond, part=el.dataset.part, cond=g.conditions[idx]; if(!cond) return;
  if(part==='field'){cond.field=el.value; cond.op=cond.field==='tagExists'?'exists':'equals'; cond.value=''; cond.tagKey='Env'; refresh(); return;}
  cond[part]=el.value;
  if(isSel) refresh(); else updateBuilderDerived();
}
function updateBuilderDerived(){
  const g=groupById(editGroupId);
  const pv=document.getElementById('preview'); if(pv) pv.outerHTML=previewHtml(g);
  const rail=document.getElementById('rail'); if(rail) rail.outerHTML=railHtml();
  updateStats();
}
function updateResBody(){
  const rows=filteredResources(); const tb=document.getElementById('res-body');
  if(tb) tb.innerHTML=rows.slice(0,400).map(r=>resRow(r,'explorer')).join('')||'<tr><td colspan="7"><div class="empty">Nothing matches.</div></td></tr>';
  const fc=document.getElementById('filt-count'); if(fc) fc.textContent=rows.length+' of '+RESOURCES.length;
}
function toggleAI(){ const open=document.getElementById('drawer').classList.toggle('open'); document.getElementById('drawer-bg').classList.toggle('open',open); if(open){renderAI(); setTimeout(()=>document.getElementById('ai-input').focus(),150);} }

/* ---------- boot ---------- */
renderAI();
render();
</script>
